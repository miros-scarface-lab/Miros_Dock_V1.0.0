<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Miros Web Dock</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body class="light-mode login-body">
    <div class="background-canvas">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="login-page-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <span class="material-icons-round">cloud_queue</span>
                </div>
                <h1>Miros<span>Dock</span></h1>
                <p>Welcome back, please sign in.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <div class="input-wrapper">
                        <label for="username" class="hidden">Username</label>
                        <span class="material-icons-round">person</span>
                        <input type="text" id="username" placeholder="Username" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-wrapper">
                        <label for="password" class="hidden">Password</label>
                        <span class="material-icons-round">lock</span>
                        <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                    </div>
                </div>
                <div id="errorMsg" class="error-text hidden">
                    <span class="material-icons-round">error</span>
                    <span>Invalid credentials</span>
                </div>
                <button type="submit" class="login-btn">
                    <span>Sign In</span>
                    <span class="material-icons-round">arrow_forward</span>
                </button>
            </form>
        </div>
    </div>

    <style>
        .login-body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-main);
        }

        .login-page-container {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .login-card {
            background: var(--bg-glass-heavy);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-glass);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-bold);
            animation: cardFadeIn 0.5s ease-out;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin: 0 auto 16px;
            font-size: 32px;
            box-shadow: 0 8px 16px rgba(0, 122, 255, 0.2);
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .login-header h1 span { color: var(--accent-primary); }
        .login-header p { color: var(--text-muted); font-size: 15px; font-weight: 500; }

        .form-group {
            margin-bottom: 16px;
        }

        .input-wrapper {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            height: 56px;
            border: 1px solid transparent;
            transition: var(--transition-smooth);
        }

        body.dark-mode .input-wrapper { background: rgba(255, 255, 255, 0.05); }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
            background: white;
            box-shadow: var(--shadow-soft);
        }

        body.dark-mode .input-wrapper:focus-within { background: #2C2C2E; }

        .input-wrapper span { color: var(--text-muted); font-size: 20px; }
        .input-wrapper input {
            background: none;
            border: none;
            width: 100%;
            height: 100%;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            outline: none;
            font-family: inherit;
        }

        .error-text {
            color: #FF3B30;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding: 0 8px;
        }

        .login-btn {
            width: 100%;
            height: 56px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 122, 255, 0.3);
            transition: var(--transition-smooth);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(0, 122, 255, 0.4);
        }

        .login-btn:active { transform: translateY(0); }
    </style>

    <script>
        // Apply theme from localStorage
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.className = `${savedTheme}-mode login-body`;

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('session_token', data.token);
                    window.location.href = '/';
                } else {
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerHTML = '<span class="material-icons-round">error</span><span>Server error</span>';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
