name: miros_share_and_web_dock
description: "A merged Flutter project for sharing and web docking."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # App 1 Dependencies (Miros Send)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  hive_flutter: ^1.1.0
  window_manager: ^0.5.2
  permission_handler: ^13.0.1
  device_info_plus: ^13.2.0
  bonsoir: ^7.1.5
  uuid: ^4.6.0
  freezed_annotation: ^2.4.4
  google_fonts: ^8.2.1
  file_picker: ^12.1.3
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  encrypt: ^5.0.3
  archive: ^4.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  network_info_plus: ^8.2.1
  open_filex: ^4.7.0
  mobile_scanner: ^7.4.0
  logger: ^2.7.0

  # App 2 Dependencies (Miros Portable Web Server)
  logging: ^1.3.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  flutter_foreground_task: ^11.0.1
  connectivity_plus: ^7.3.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_cors_headers: ^0.1.5
  shelf_multipart: ^2.0.1
  mime: ^2.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter:
  uses-material-design: true
  
  assets:
    - assets/web_server/
    - assets/web_server/css/
    - assets/web_server/js/
    - assets/app_icon.png
    - assets/splash/portrait.png
    - assets/splash/landscape.png


# Branding tools removed to use Dart implementation
# flutter_launcher_icons remains for app icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/app_icon.png"
  linux:
    generate: true
    image_path: "assets/app_icon.png"

